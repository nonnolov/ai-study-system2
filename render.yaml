services:
  - type: web
    name: ai-study-system-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --port $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
  - type: web
    name: ai-study-system-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-study-system-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: UPLOAD_DIR
        value: /opt/render/project/src/storage/uploads
      - key: AI_PROVIDER
        value: mock
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false

databases:
  - name: ai-study-system-db
    databaseName: aistudy
    user: aistudy
    plan: starter
